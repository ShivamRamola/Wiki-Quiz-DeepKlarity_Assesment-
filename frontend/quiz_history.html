<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wiki Quiz - History</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
      }
      .container {
        max-width: 1000px;
        margin: 0 auto;
      }
      header {
        text-align: center;
        color: white;
        margin-bottom: 40px;
      }
      header h1 {
        font-size: 2.5rem;
        font-weight: 700;
        margin-bottom: 8px;
      }
      header p {
        font-size: 1.1rem;
        opacity: 0.95;
      }
      .nav-link {
        display: inline-block;
        padding: 10px 20px;
        background: white;
        color: #667eea;
        text-decoration: none;
        border-radius: 8px;
        font-weight: 600;
        transition: all 0.3s ease;
        margin-bottom: 30px;
      }
      .nav-link:hover {
        background: #f0f0f0;
        transform: translateY(-2px);
      }
      table {
        width: 100%;
        background: white;
        border-collapse: collapse;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      }
      th {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 14px;
        text-align: left;
        font-weight: 600;
      }
      td {
        padding: 14px;
        border-bottom: 1px solid #f1f1f1;
        color: #555;
      }
      tr:hover {
        background: #f9faff;
      }
      .btn {
        padding: 8px 16px;
        border-radius: 6px;
        border: none;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.3s ease;
        font-size: 0.9rem;
      }
      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 3px 10px rgba(102, 126, 234, 0.3);
      }
      .btn-close {
        background: white;
        color: #667eea;
        border: 2px solid #667eea;
        margin-bottom: 16px;
      }
      #modal {
        display: none;
        position: fixed;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.6);
        z-index: 1000;
        overflow-y: auto;
      }
      #modal.active {
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 40px 20px;
      }
      #modal .content {
        background: white;
        padding: 30px;
        width: 90%;
        max-width: 900px;
        border-radius: 12px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        animation: modalSlideIn 0.3s ease;
      }
      @keyframes modalSlideIn {
        from {
          opacity: 0;
          transform: translateY(-50px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .card {
        background: #f9faff;
        border-left: 4px solid #667eea;
        padding: 16px;
        margin-bottom: 12px;
        border-radius: 8px;
      }
      .card h2 {
        color: #667eea;
        font-size: 1.8rem;
        margin-bottom: 8px;
        border-bottom: 3px solid #667eea;
        padding-bottom: 8px;
      }
      .card h3 {
        color: #764ba2;
        font-size: 1.2rem;
        margin-top: 16px;
        margin-bottom: 8px;
      }
      .card p {
        color: #555;
        line-height: 1.6;
        margin-bottom: 8px;
      }
      .topics-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 8px;
      }
      .topic-tag {
        background: #f0f4ff;
        color: #667eea;
        padding: 6px 12px;
        border-radius: 20px;
        font-size: 0.9rem;
        font-weight: 500;
      }
      .quiz-item {
        background: white;
        border: 1px solid #e0e0e0;
        border-left: 4px solid #764ba2;
        padding: 14px;
        margin-bottom: 12px;
        border-radius: 6px;
      }
      .quiz-item strong {
        color: #333;
        font-size: 1rem;
        display: block;
        margin-bottom: 10px;
      }
      .quiz-item ul {
        list-style: none;
        margin-bottom: 10px;
        margin-left: 0;
      }
      .quiz-item li {
        padding: 6px 0;
        color: #555;
        margin-left: 20px;
      }
      .quiz-item li:before {
        content: "○ ";
        color: #764ba2;
        font-weight: bold;
        margin-left: -16px;
        margin-right: 8px;
      }
      .quiz-item li.correct {
        color: #27ae60;
        font-weight: 500;
      }
      .quiz-item li.correct:before {
        content: "✓ ";
        color: #27ae60;
      }
      .quiz-meta {
        font-size: 0.85rem;
        color: #666;
        display: flex;
        gap: 16px;
        margin-top: 8px;
      }
      .difficulty-easy {
        color: #27ae60;
      }
      .difficulty-medium {
        color: #f39c12;
      }
      .difficulty-hard {
        color: #e74c3c;
      }
      .empty-state {
        text-align: center;
        padding: 60px 20px;
        color: white;
      }
      .empty-state h2 {
        font-size: 1.5rem;
        margin-bottom: 8px;
      }
      @media (max-width: 600px) {
        table {
          font-size: 0.85rem;
        }
        th,
        td {
          padding: 8px;
        }
        header h1 {
          font-size: 1.8rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>📚 Quiz History</h1>
        <p>All generated quizzes from Wikipedia articles</p>
      </header>

      <a href="Quiz.html" class="nav-link">← Back to Generate</a>

      <table id="historyTable">
        <thead>
          <tr>
            <th>ID</th>
            <th>Title</th>
            <th>URL</th>
            <th>Created</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>

      <div class="empty-state" id="emptyState" style="display: none">
        <h2>No quizzes yet</h2>
        <p>Generate your first quiz to see it here!</p>
      </div>
    </div>

    <div id="modal">
      <div class="content">
        <button class="btn btn-close" onclick="closeModal()">✕ Close</button>
        <div id="details"></div>
      </div>
    </div>

    <script>
      async function loadHistory() {
        try {
          const res = await fetch("http://127.0.0.1:8000/api/history");
          const list = await res.json();
          const tbody = document.querySelector("#historyTable tbody");
          tbody.innerHTML = "";
          if (list.length === 0) {
            document.getElementById("historyTable").style.display = "none";
            document.getElementById("emptyState").style.display = "block";
          } else {
            list.forEach((item) => {
              const tr = document.createElement("tr");
              const date = new Date(item.created_at).toLocaleDateString(
                "en-US",
                {
                  year: "numeric",
                  month: "short",
                  day: "numeric",
                  hour: "2-digit",
                  minute: "2-digit",
                }
              );
              tr.innerHTML = `
                <td>#${item.id}</td>
                <td>${item.title || "—"}</td>
                <td><a href="${
                  item.url
                }" target="_blank" style="color: #667eea; text-decoration: none;">View →</a></td>
                <td>${date}</td>
                <td><button class="btn" onclick="showDetails(${
                  item.id
                })">📖 Details</button></td>
              `;
              tbody.appendChild(tr);
            });
          }
        } catch (err) {
          console.error(err);
          document.getElementById("historyTable").style.display = "none";
          document.getElementById("emptyState").innerHTML =
            "<h2>Failed to load history</h2><p>Please check your connection.</p>";
          document.getElementById("emptyState").style.display = "block";
        }
      }

      async function showDetails(id) {
        try {
          const res = await fetch("http://127.0.0.1:8000/api/history/" + id);
          const data = await res.json();
          const container = document.getElementById("details");
          container.innerHTML = renderCard(data);
          document.getElementById("modal").classList.add("active");
        } catch (err) {
          alert("Failed to load item");
        }
      }

      function closeModal() {
        document.getElementById("modal").classList.remove("active");
      }

      function renderCard(data) {
        let html = `<div class="card">
          <h2>${data.title || "Untitled"}</h2>
          <p><strong>🔗 URL:</strong> <a href="${
            data.url
          }" target="_blank" style="color: #667eea;">${data.url}</a></p>
        </div>`;

        html += `<div class="card">
          <h3>📄 Summary</h3>
          <p>${data.summary || "No summary available"}</p>
        </div>`;

        html += `<div class="card">
          <h3>🔗 Related Topics</h3>
          <div class="topics-list">
            ${(data.related_topics || [])
              .map((t) => `<span class="topic-tag">${t}</span>`)
              .join("")}
          </div>
        </div>`;

        html += `<div class="card"><h3>❓ Quiz Questions</h3>`;
        if (data.quiz && data.quiz.length > 0) {
          data.quiz.forEach((q, i) => {
            const diffClass = `difficulty-${q.difficulty}`;
            html += `<div class="quiz-item">
              <strong>${i + 1}. ${q.question}</strong>
              <ul>
                ${q.options
                  .map((opt, j) => {
                    const isCorrect = opt === q.answer;
                    const classStr = isCorrect ? "correct" : "";
                    return `<li class="${classStr}">${String.fromCharCode(
                      65 + j
                    )}. ${opt}</li>`;
                  })
                  .join("")}
              </ul>
              <div class="quiz-meta">
                <span class="${diffClass}">Difficulty: ${q.difficulty}</span>
              </div>
              <p style="margin-top: 8px; font-size: 0.9rem; color: #666;"><em>💡 ${
                q.explanation
              }</em></p>
            </div>`;
          });
        } else {
          html += `<p>No quiz questions available</p>`;
        }
        html += `</div>`;
        return html;
      }

      window.onload = loadHistory;
    </script>
  </body>
</html>
