<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wiki Quiz App</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
      }
      .container {
        max-width: 900px;
        margin: 0 auto;
      }
      header {
        text-align: center;
        color: white;
        margin-bottom: 40px;
      }
      header h1 {
        font-size: 2.5rem;
        font-weight: 700;
        margin-bottom: 8px;
      }
      header p {
        font-size: 1.1rem;
        opacity: 0.95;
      }
      .input-section {
        background: white;
        border-radius: 12px;
        padding: 30px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        margin-bottom: 30px;
      }
      .input-wrapper {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
      }
      input[type="text"] {
        flex: 1;
        min-width: 250px;
        padding: 12px 16px;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        font-size: 1rem;
        transition: all 0.3s ease;
      }
      input[type="text"]:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      }
      button {
        padding: 12px 28px;
        border-radius: 8px;
        border: none;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        font-weight: 600;
        cursor: pointer;
        font-size: 1rem;
        transition: all 0.3s ease;
        white-space: nowrap;
      }
      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
      }
      button:active {
        transform: translateY(0);
      }
      .nav-link {
        display: inline-block;
        padding: 12px 24px;
        background: white;
        color: #667eea;
        text-decoration: none;
        border-radius: 8px;
        font-weight: 600;
        transition: all 0.3s ease;
        white-space: nowrap;
      }
      .nav-link:hover {
        background: #f0f0f0;
        transform: translateY(-2px);
      }
      .card {
        background: white;
        border-radius: 12px;
        padding: 24px;
        margin-bottom: 20px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        animation: slideIn 0.4s ease;
      }
      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .card h2 {
        color: #667eea;
        font-size: 1.8rem;
        margin-bottom: 12px;
        border-bottom: 3px solid #667eea;
        padding-bottom: 12px;
      }
      .card h3 {
        color: #764ba2;
        font-size: 1.3rem;
        margin-bottom: 12px;
        margin-top: 16px;
      }
      .card p {
        color: #555;
        line-height: 1.6;
        margin-bottom: 8px;
      }
      .topics-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
      }
      .topic-tag {
        background: #f0f4ff;
        color: #667eea;
        padding: 6px 12px;
        border-radius: 20px;
        font-size: 0.9rem;
        font-weight: 500;
      }
      .quiz-item {
        background: #f9faff;
        border-left: 4px solid #667eea;
        padding: 16px;
        margin-bottom: 16px;
        border-radius: 6px;
      }
      .quiz-item strong {
        color: #333;
        font-size: 1.05rem;
        display: block;
        margin-bottom: 12px;
      }
      .quiz-item ul {
        list-style: none;
        margin-bottom: 12px;
      }
      .quiz-item li {
        padding: 8px 0;
        color: #555;
        margin-left: 20px;
      }
      .quiz-item li:before {
        content: "◆ ";
        color: #764ba2;
        font-weight: bold;
        margin-left: -16px;
        margin-right: 8px;
      }
      .quiz-meta {
        font-size: 0.9rem;
        color: #888;
        display: flex;
        gap: 20px;
        margin-top: 12px;
      }
      .difficulty-easy {
        color: #27ae60;
      }
      .difficulty-medium {
        color: #f39c12;
      }
      .difficulty-hard {
        color: #e74c3c;
      }
      .loader {
        display: none;
        text-align: center;
        margin: 20px 0;
      }
      .loader.active {
        display: block;
      }
      .spinner {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #667eea;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: 0 auto;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      .error-message {
        background: #ffebee;
        color: #c62828;
        padding: 12px 16px;
        border-radius: 8px;
        margin-bottom: 16px;
        border-left: 4px solid #c62828;
      }
      @media (max-width: 600px) {
        .input-wrapper {
          flex-direction: column;
        }
        input[type="text"] {
          min-width: 100%;
        }
        button {
          width: 100%;
        }
        header h1 {
          font-size: 1.8rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>📚 Wiki Quiz</h1>
        <p>Learn from Wikipedia articles through interactive quizzes</p>
      </header>

      <div class="input-section">
        <div class="input-wrapper">
          <input
            id="url"
            type="text"
            placeholder="https://en.wikipedia.org/wiki/Alan_Turing"
          />
          <button onclick="generate()">Generate Quiz</button>
          <a href="quiz_history.html" class="nav-link">📋 Past Quizzes</a>
        </div>
      </div>

      <div class="loader" id="loader">
        <div class="spinner"></div>
      </div>

      <div id="result"></div>
    </div>

    <script>
      async function generate() {
        const url = document.getElementById("url").value.trim();
        if (!url) {
          alert("Enter a Wikipedia URL");
          return;
        }
        const loader = document.getElementById("loader");
        loader.classList.add("active");
        try {
          const res = await fetch("http://127.0.0.1:8000/api/generate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ url }),
          });
          loader.classList.remove("active");
          if (!res.ok) {
            const txt = await res.text();
            const result = document.getElementById("result");
            result.innerHTML = `<div class="error-message">Error: ${txt}</div>`;
            return;
          }
          const data = await res.json();
          renderResult(data);
        } catch (err) {
          loader.classList.remove("active");
          const result = document.getElementById("result");
          result.innerHTML = `<div class="error-message">Network error: ${err}</div>`;
        }
      }

      function renderResult(data) {
        const out = document.getElementById("result");
        let html = `<div class="card">
          <h2>${data.title || "Untitled"}</h2>
          <p>${data.summary || "No summary available"}</p>
        </div>`;

        html += `<div class="card">
          <h3>🔗 Related Topics</h3>
          <div class="topics-list">
            ${(data.related_topics || [])
              .map((t) => `<span class="topic-tag">${t}</span>`)
              .join("")}
          </div>
        </div>`;

        html += `<div class="card"><h3>❓ Quiz Questions</h3>`;
        if (data.quiz && data.quiz.length > 0) {
          data.quiz.forEach((q, i) => {
            const diffClass = `difficulty-${q.difficulty}`;
            html += `<div class="quiz-item">
              <strong>${i + 1}. ${q.question}</strong>
              <ul>
                ${q.options
                  .map(
                    (opt, j) =>
                      `<li>${String.fromCharCode(65 + j)}. ${opt}</li>`
                  )
                  .join("")}
              </ul>
              <div class="quiz-meta">
                <span>✓ Answer: <strong>${q.answer}</strong></span>
                <span class="${diffClass}">Difficulty: ${q.difficulty}</span>
              </div>
              <p style="margin-top: 8px; font-size: 0.9rem; color: #666;"><em>💡 ${
                q.explanation
              }</em></p>
            </div>`;
          });
        } else {
          html += `<p>No quiz questions available</p>`;
        }
        html += `</div>`;
        out.innerHTML = html;
      }
    </script>
  </body>
</html>
